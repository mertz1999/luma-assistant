<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      (() => {
        const isTasks = window.location.pathname.startsWith("/taskmanager");
        const config = isTasks
          ? {
              title: "Luma Tasks",
              theme: "#000000",
              faviconSvg: "",
              faviconPng: "/icons/taskmanager-icon-192.png",
              appleIcon: "/taskmanager-apple-touch-icon.png",
              manifest: "/taskmanager.webmanifest",
            }
          : {
              title: "Luma Assistant",
              theme: "#0ea5e9",
              faviconSvg: "/favicon.svg",
              faviconPng: "/icons/icon-192.png",
              appleIcon: "/apple-touch-icon.png",
              manifest: "/manifest.webmanifest",
            };

        document.write(`
          ${config.faviconSvg ? `<link rel="icon" type="image/svg+xml" href="${config.faviconSvg}" />` : ""}
          <link rel="icon" type="image/png" sizes="192x192" href="${config.faviconPng}" />
          <link rel="apple-touch-icon" sizes="180x180" href="${config.appleIcon}" />
          <link rel="manifest" href="${config.manifest}" />
          <meta name="theme-color" content="${config.theme}" />
          <meta name="application-name" content="${config.title}" />
          <meta name="apple-mobile-web-app-title" content="${config.title}" />
          <title>${config.title}</title>
        `);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
